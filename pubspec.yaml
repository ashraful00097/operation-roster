name: operation_roster
description: "Operation Duty Roster"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5

  # Excel file generation
  excel: ^4.0.6

  # Temporary file storage
  path_provider: ^2.1.6

  # Share / Save generated Excel file
  share_plus: ^13.3.0
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/templates/duty_roster_template.xlsx